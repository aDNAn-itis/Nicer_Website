<nav class="navbar">

        <span>NASA NICER</span>
      </div>

      <ul class="nav-menu">
        {% url 'index' as index_url %}
        <li>
          <a href="{{ index_url }}" class="nav-link {% if request.path == index_url %}active{% endif %}">

            Home
          </a>
        </li>

        {% url 'file_mgr:directory' '/' as file_mgr_url %}
        <li>

          </a>
        </li>

        {% url 'plots:plots' as plots_url %}
        <li>
          <a href="{{ plots_url }}" class="nav-link {% if request.path == plots_url %}active{% endif %}">

          </a>

          <button onclick="openSearchModal()" class="nav-search-btn" title="Search (Ctrl+K)">
