<header class="site-header">
  {% url 'index' as index_url %}
  <a href="{{ index_url }}" class="header-brand">NASA NICER</a>

  <nav class="header-nav" aria-label="Primary navigation">
    <a href="{{ index_url }}" {% if request.path == index_url %}aria-current="page"{% endif %}>Home</a>

    {% url 'file_mgr:directory' '/' as file_mgr_url %}
    <a href="{{ file_mgr_url }}" {% if request.path == file_mgr_url %}aria-current="page"{% endif %}>Data Browser</a>

    {% url 'plots:plots' as plots_url %}
    <a href="{{ plots_url }}" {% if request.path == plots_url %}aria-current="page"{% endif %}>Interactive Plots</a>

    {% url 'about' as about_url %}
    <a href="{{ about_url }}" {% if request.path == about_url %}aria-current="page"{% endif %}>About</a>
  </nav>
</header>
